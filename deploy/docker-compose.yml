services:
  tax2ai-mcp:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      PUBLIC_MODE: "1"
      TRUST_PROXY: "1"
      PUBLIC_ENDPOINT: https://mcp.tax2.ai/mcp
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../public:/srv/public:ro
      - caddy_data:/data
    depends_on: [tax2ai-mcp]
volumes:
  caddy_data:
